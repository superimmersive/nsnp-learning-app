services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nsnp_migrator
      POSTGRES_PASSWORD: nsnp_migrator
      POSTGRES_DB: nsnp
    ports:
      - "5432:5432"
    volumes:
      - ./api/docker/init-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nsnp_migrator -d nsnp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://nsnp_migrator:nsnp_migrator@postgres:5432/nsnp
      DATABASE_APP_URL: postgres://nsnp_app:nsnp_app@postgres:5432/nsnp
      SMS_PROVIDER: console
      SMS_PEPPER: local-dev-sms-pepper
      TOKEN_PEPPER: local-dev-token-pepper
      PIN_PEPPER: local-dev-pin-pepper
      SEED_OFFICIAL_TOKEN: local-dev-official
      SEED_ADMIN_TOKEN: local-dev-admin
      PORT: "8787"
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
