name: iOS TestFlight

# Optional. Manual only. A Mac with Xcode signed into team U5DGDWXQCP is the
# primary path (see store/RELEASE.md). This job needs the App Store Connect API
# key plus the distribution certificate, because the runner has no keychain.

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: CFBundleVersion. 1 is already on TestFlight. Use 2 or higher.
        required: true
        default: "2"
      version_name:
        description: CFBundleShortVersionString
        required: true
        default: "1.0.0"

jobs:
  testflight:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: app
        run: npm ci

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          if [ -z "$ASC_KEY_CONTENT" ]; then
            echo "Missing secret ASC_KEY_CONTENT (the .p8 file for key S78XAXRG43)."
            exit 1
          fi
          printf '%s\n' "$ASC_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Import the distribution certificate
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" ] || [ -z "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" ]; then
            echo "Missing IOS_DISTRIBUTION_CERTIFICATE_BASE64 or its password."
            echo "The runner cannot use automatic signing without the private key from the Mac."
            exit 1
          fi
          echo "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "" "$RUNNER_TEMP/build.keychain"
          security default-keychain -s "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p "" "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/distribution.p12" -k "$RUNNER_TEMP/build.keychain" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$RUNNER_TEMP/build.keychain"

      - name: Install fastlane
        working-directory: app/ios
        run: bundle install

      - name: Upload to TestFlight
        working-directory: app/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          IOS_BUILD_NUMBER: ${{ inputs.build_number }}
          IOS_VERSION: ${{ inputs.version_name }}
        run: bundle exec fastlane beta
