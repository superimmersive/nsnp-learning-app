name: Android App Bundle

# Manual only. Signs with the existing Play upload key from repository secrets.
# Do not put a newly generated keystore in ANDROID_KEYSTORE_BASE64.
# Gradle checks SHA-1 69:D4:67:3D:AA:1B:F6:71:C5:A1:E7:65:FE:FA:D5:B7:B8:BA:9E:CA and alias nsnp.

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Play versionCode. 1 is already published. Use 2 or higher.
        required: true
        default: "2"
      version_name:
        description: versionName shown on Play
        required: true
        default: "1.0.0"

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Decode the existing upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64 (the existing nsnp-upload.keystore)."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nsnp-upload.keystore"

      - name: Build signed AAB
        working-directory: app
        env:
          NSNP_STORE_FILE: ${{ runner.temp }}/nsnp-upload.keystore
          NSNP_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NSNP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NSNP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NSNP_VERSION_CODE: ${{ inputs.version_code }}
          NSNP_VERSION_NAME: ${{ inputs.version_name }}
        run: npm run android:aab

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: nsnp-learning-${{ inputs.version_name }}-vc${{ inputs.version_code }}
          path: app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
